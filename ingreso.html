<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
        @import "tailwindcss";
        @import url('https://googleapis.com');
        @theme {
            --font-press: "Press Start 2P", cursive;
            --font-exo: "Exo 2", sans-serif;
        }
    </style>
</head>
<body class="text-[#4CC9F0] font-exo bg-[#5A189A]">
    <div class="bg-[#3C096C] p-4">
        <header class="flex justify-between items-center">
            <a href="#">Home</a>
            <h1 class="text-[#F72585] font-press">GameZone</h1>
            <button class="bg-[#240046] rounded-xl shadow-sm shadow-[#4CC9F0]/50 p-2 text-sm hover:shadow-[#4CC9F0] hover:shadow-md active:scale-98 transition-all duration-200">Iniciar Sesión</button>
        </header>
    </div>

    <div>
    <section>
        <form id="loginForm" class="bg-[#F72585]">

            <h2>Inicio de Sesión</h2>

            <div>
                <label for="correo">Correo</label>
                <input 
                    type="email" 
                    id="correo"
                    placeholder="john@doe.com"
                >
                <p id="errorCorreo"></p>
            </div>

            <div>
                <label for="contrasena">Contraseña</label>
                <input 
                    type="password" 
                    id="contrasena"
                    placeholder="••••••••"
                >
                <p id="errorContrasena"></p>
            </div>

            <button type="submit">
                Iniciar Sesión
            </button>

            <p id="mensajeLogin"></p>

        </form>
    </section>
</div>
<script>

    const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", function(event) {

        event.preventDefault();

        const correo = document.getElementById("correo").value;
        const contrasena = document.getElementById("contrasena").value;

        const errorCorreo = document.getElementById("errorCorreo");
        const errorContrasena = document.getElementById("errorContrasena");
        const mensajeLogin = document.getElementById("mensajeLogin");

        errorCorreo.textContent = "";
        errorContrasena.textContent = "";
        mensajeLogin.textContent = "";

        let hayError = false;

        const usuarioGuardado = localStorage.getItem("usuarioGameZone");

        if (usuarioGuardado === null) {

            mensajeLogin.textContent = "No existe una cuenta registrada.";

            return;
        }

        const usuario = JSON.parse(usuarioGuardado);

        if (correo !== usuario.correo) {

            mensajeLogin.textContent = "El correo electrónico es incorrecto.";

        } else if (contrasena !== usuario.contrasena) {

            mensajeLogin.textContent = "La contraseña es incorrecta.";

        } else {

            mensajeLogin.textContent = "Inicio de sesión exitoso.";

        }
    });

</script>
</body>
</html>
